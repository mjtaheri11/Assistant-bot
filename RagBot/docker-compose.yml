version: '3.8'

services:
  api:
    build: .
    image: assistant-bot:dude_compose
    container_name: assistant-bot-container
    ports:
      - "8689:8689"
      - "8003:8585"
    volumes:
      - ./.env:/app/RagBot/.env
      - ../VectorDB_e5:/app/VectorDB_e5
      - ../db-cache:/app/db-cache
      - ../saved_models:/app/saved_models
      - log_data:/var/log  # Shared volume for log files
    environment:
      - OLLAMA_HOST=${API_OLLAMA_HOST}
      - CUDA_VISIBLE_DEVICES=2
    dns:
      - 178.22.122.100
      - 181.41.194.186
      - 8.8.8.8
      
      # - 178.22.122.100
      # - 185.51.200.2
      # - 8.8.8.8
    restart: always
    user: root
    depends_on:
      # - ollama
      - vllmserver
      - kibana
      - elasticsearch
      - grafana
    networks:
      - ollama-docker2

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - 8980:11434
  #   volumes:
  #     - /usr/share/ollama/.ollama/:/root/.ollama
  #   container_name: ollama
  #   tty: true
  #   restart: always
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
  #     # - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}
  #   networks:
  #     - ollama-docker2

  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   runtime: nvidia

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatbot
    volumes:
      - /var/lib/postgresql:/var/lib/postgresql/data
    networks:
      - ollama-docker2
    restart: always
    user: root
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8688:80"
    tty: true
    networks:
      - ollama-docker2
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.admin
      PGADMIN_DEFAULT_PASSWORD: admin
    user: root
    restart: always
    volumes:
      - /var/lib/pgadmin:/var/lib/pgadmin

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - "xpack.security.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # - /usr/share/elasticsearch:/usr/share/elasticsearch/data
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - ollama-docker2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - LS_JAVA_OPTS="-XX:-UseConcMarkSweepGC"
      - LS_JAVA_OPTS="-Xms512m -Xmx1g"
      - LOG_LEVEL=debug
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=RASFyGVFAtgtk+2N/PL/rsWvrykiHOtufLiN0+2HyXc=
    ports:
      - 8001:5601
    networks:
      - ollama-docker2

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.9
    container_name: logstash
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - log_data:/var/log  # Mount the same shared volume here
    ports:
      - "5044:5044" # Filebeat to Logstash
      - "9600:9600" # Logstash monitoring
    networks:
      - ollama-docker2
    depends_on:
      - elasticsearch
    environment:
      - "xpack.monitoring.enabled=false"
    restart: always

  # filebeat:
  #   image: docker.elastic.co/beats/filebeat:7.17.9
  #   container_name: filebeat_1
  #   volumes:
  #     - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml
  #     - log_data:/var/log  # Mount the same shared volume here
  #   networks:
  #     - ollama-docker2
  #   depends_on:
  #     - elasticsearch
  #   user: root
  #   command: >
  #     sh -c "chown root:root /usr/share/filebeat/filebeat.yml &&
  #           chmod go-w /usr/share/filebeat/filebeat.yml &&
  #           filebeat -e -c /usr/share/filebeat/filebeat.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-assistant
    ports:
      - "8002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ollama-docker2
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
    user: root
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-assistant
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ollama-docker2

  vllmserver:
    image: vllm/vllm-openai:v0.3.3
    container_name: vllm-assistant
    # build: .
    ports:
      - "8690:8000"
    volumes:
      - ../saved_models/openai-gpt-oss-20b:/models/openai-gpt-oss-20b
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      #- "HUGGING_FACE_HUB_TOKEN=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"
      - "CUDA_VISIBLE_DEVICES=2,1"
      - "CUDA_LAUNCH_BLOCKING=1"
      - "VLLM_LOGGING_LEVEL=DEBUG"
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
      - "PYTHONUNBUFFERED=1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use one GPU
              capabilities: [gpu]
    shm_size: "10g"
    ipc: host  # Critical for multi-GPU
    command: [
      "--model", "/models/aya-expanse-32b-gptq-4bit",
      "--tensor-parallel-size", "1",
      "--max-model-len", "4096",
      "--gpu-memory-utilization", "0.9",
      "--host", "0.0.0.0"
    ]
    networks:
      - ollama-docker2
 

volumes:
  esdata:
  log_data:  
  VectorDB:
  grafana_data:

networks:
  ollama-docker2:
    external: false
    driver: bridge
