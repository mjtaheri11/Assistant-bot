# Configurations for logging
logging:
  level: debug
  file: app.log
  max_size: 10*1024*1024

api:
  port: 8686

postgres:
  address: cs-sg-da-postgresql.cs-sg-da.svc.cluster.local # 172.26.0.2 # 172.26.0.6 # postgres # 172.20.0.6 # 192.168.208.2
  database: chatbot
  max_user_input_character_length: 200
  history_length: 3
  port: 5432
  password: "**********"
  user: postgres


cache:
  # host: redis-stack
  host: 127.0.0.1
  port: 9200
  knn: 50
  alpha_threshold: 0.1
  beta_threshold: 0.2
  redis_result_num_documents: 5
  socket_timeout: 10
  index_name: Hamzan
  persist_directory: /models/db-cache
  num_rank2_documents: 5
  embedding_model:
    # model_name: ../saved_models/models--BAAI--bge-m3/snapshots/babcf60cae0a1f438d7ade582983d4ba462303c2
    # model_name: ../saved_models/models--jinaai--jina-embeddings-v3
    model_name: /models/jinaai/jinaai-embedding-v3
    trust_remote_code: True
    device: cuda


  # configurations for reranker
  reranker:
    model_name: /models/jinaai/bge-reranker-v2-m3
    # model_name: /home/user01/.cache/huggingface/hub/models--BAAI--bge-reranker-v2-gemma/snapshots/1787044f8b6fb740a9de4557c3a12377f84d9e17
    device: cuda
    cutoff: 10

  schema:
    query_field_name: query
    vector_field_name: vector
    answer_field_name: answer
    url_field_name: url
    message_id_field_name: message_id
    thumb_up_field_name: thumb_up
    thumb_down_field_name: thumb_down
    flag_field_name: flag

# Configurations for streamlit
streamlit:
  host: 0.0.0.0
  port: 8505

# configurations for embedding model
embedding_model:
  # model_name: ../saved_models/models--BAAI--bge-m3/snapshots/babcf60cae0a1f438d7ade582983d4ba462303c2
  trust_remote_code: True
  model_name: /models/jinaai/jinaai-embedding-v3
  device: cuda


# configurations for reranker
reranker:
  model_name: /models/bge-reranker-v2-m3
  device: cuda


# configurations for retriever
retriever:
  retrieved_documents: 40 # initiate_vdb.py
  retrieved_rank2_documents: 8
  alpha_threshold: 0.9
  expansion: false
  rerank: true
  chunk_size: 800
  max_chunk_size: 1200
  sentence_overlap: 1
  retriever_threshold: 0.002

