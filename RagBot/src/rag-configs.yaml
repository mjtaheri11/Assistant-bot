# LLM Model Configuration - Model parameters only

api_default:
  temperature: 0.7
  max_tokens: 16000
  # module_route_model_name: gpt-4.1
  # query_responder_model_name: gpt-4.1
  # answer_validator_model_name: gpt-4.1
  # utterance_paraphraser_model_name: gpt-4.1
  # parameter_responder_model_name: gpt-5.1-codex-max
  # sql_responder_model_name: gpt-5.1-codex-max
  # chitchat_responder_model_name: gpt-4.1
  module_route_model_name: gpt-5.2-codex
  query_responder_model_name: oss
  answer_validator_model_name: oss
  utterance_paraphraser_model_name: oss
  parameter_responder_model_name: oss
  sql_responder_model_name: gpt-5.2-codex
  chitchat_responder_model_name: oss
  

api_models:
