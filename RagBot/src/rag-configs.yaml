# Configurations for logging
logging:
  level: debug
  file: app.log
  max_size: 10*1024*1024

api:
  port: 8686

postgres:
  address: postgres # 172.26.0.2 # postgres # 127.0.0.1  # 192.168.208.2
  database: chatbot
  max_user_input_character_length: 200
  history_length: 3

cache:
  # host: redis-stack
  host: 127.0.0.1
  port: 9200
  knn: 50
  alpha_threshold: 0.1
  beta_threshold: 0.2
  redis_result_num_documents: 5
  socket_timeout: 10
  index_name: Hamzan
  persist_directory: ../db-cache
  num_rank2_documents: 5
  embedding_model:
    model_name: ../saved_models/models--jinaai--jina-embeddings-v3
    device: cuda


  # configurations for reranker
  reranker:
    model_name: ../saved_models/models--BAAI--bge-reranker-v2-m3/snapshots/12e974610ba9083ed95f3edf08d7e899581f4de4
    # model_name: /home/user01/.cache/huggingface/hub/models--BAAI--bge-reranker-v2-gemma/snapshots/1787044f8b6fb740a9de4557c3a12377f84d9e17
    device: cuda
    cutoff: 10
    
  schema:
    query_field_name: query
    vector_field_name: vector
    answer_field_name: answer
    url_field_name: url
    message_id_field_name: message_id
    thumb_up_field_name: thumb_up
    thumb_down_field_name: thumb_down
    flag_field_name: flag

# Configurations for streamlit
streamlit:
  host: 0.0.0.0
  port: 8505

# configurations for ollama
ollama:
  sql_model_name: qwen2.5-coder:32b-instruct-q5_K_M
  model_name: aya-expanse:32b-q4_K_M
  temperature: 0
  stream: true
  keep_alive: -1
  saved_models: /apt/saved_models/qwen/

# configurations for embedding model
embedding_model:
  # model_name: ../saved_models/models--BAAI--bge-m3/snapshots/babcf60cae0a1f438d7ade582983d4ba462303c2
  model_name: ../saved_models/models--jinaai--jina-embeddings-v3
  device: cuda
  trust_remote_code: True

# configurations for reranker
reranker:
  model_name: ../saved_models/models--BAAI--bge-reranker-v2-m3/snapshots/12e974610ba9083ed95f3edf08d7e899581f4de4
  device: cuda


# configurations for retriever
retriever:
  retrieved_documents: 40 # initiate_vdb.py
  retrieved_rank2_documents: 8
  alpha_threshold: 0.9
  expansion: false
  rerank: true
  chunk_size: 800
  max_chunk_size: 1200
  sentence_overlap: 1
  retriever_threshold: 0.002

