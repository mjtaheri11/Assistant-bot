# configurations for embedding model
embedding_model:
  model_path: ./saved_models/models--intfloat--multilingual-e5-large/snapshots/0dc5580a448e4284468b8909bae50fa925907bc5
  # model_path: /home/jovyan/Assistant-bot/RagBot/saved_models/Qwen3-Embedding-4B
  device: cuda
  # Type: "triton" or "local" or "openrouter"
  type: triton
  # Triton Embedding Configuration
  model_name: "e5"  # Model name in Triton server
  # model_name: "qwen3"  # Model name in Triton server
  triton_url: http://triton-server.admin.svc.cluster.local
  # triton_url: http://qwen3-embedding-soroush.cs-sg-da-dev.svc.cluster.local:82
  tokenizer_path: ./saved_models/models--intfloat--multilingual-e5-large/snapshots/0dc5580a448e4284468b8909bae50fa925907bc5
  # tokenizer_path: /home/jovyan/Assistant-bot/RagBot/saved_models/Qwen3-Embedding-4B
  max_length: 512
  # max_length: 8192
  timeout: 30
  batch_size: 32
  # batch_size: 1
  # type: "openrouter"

# configurations for reranker
reranker:
  type: triton
  # type: service
  model_name: bge  # Same model serving both embedding and reranking
  # model_name: Qwen3-Reranker-4B
  triton_url: http://triton-server.admin.svc.cluster.local
  max_length: 8192
  api_type: custom_v2 # legacy OR openrouter
  api_url: http://qwen3-rr-4b-predictor.admin.svc.cluster.local/v2/rerank 
  batch_size: 32
  flag_model: 
      model_path: ./saved_models/models--BAAI--bge-reranker-v2-m3/snapshots/953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      device: cuda
  
  qwen_model: 
      model_path: ./saved_models/qwen3-reranker
      device: cuda
      max_length: 8192


# configurations for retriever
retriever:
  retrieved_documents: 40
  retrieved_rank2_documents: 10
  sql_retrieved_rank2_documents: 25
  retriever_threshold: 0.0
  alpha_threshold: 0.5
  use_reranker: true
  # use_reranker: false
  

